---
- name: Install gcc
  yum:
    name: gcc
    state: present
    lock_timeout: 60
  
- name: Enable the nvidia network repo
  shell: >-
    dnf -y config-manager --add-repo https://developer.download.nvidia.com/compute/cuda/repos/rhel9/x86_64/cuda-rhel9.repo
  become: true

- name: CRB/PowerTools must be enabled
  shell: >-
    crb enable
  become: true

- name: Perform a dnf update now
  shell: >-
    dnf update -y
  become: true

- name: Initiate a reboot of the server
  ansible.builtin.reboot:
    reboot_timeout: 300 # seconds to wait before giving up

- name: Wait for the server to be reachable again
  ansible.builtin.wait_for_connection:
    delay: 10 # seconds to wait before the first check
    timeout: 300 # seconds to wait before giving up

- name: Install kernel headers and development packages
  shell: >-
    dnf -y install kernel-devel-$(uname -r) kernel-headers-$(uname -r)
  become: true